[package]
name = "ferroterm"
version = "0.1.0"
edition = "2024"
description = "Client SSH à onglets avec gestionnaire de sessions et explorateur SFTP"

[dependencies]
anyhow = "1"
arboard = "3"
diffy = "0.5.2"
directories = "6"
eframe = "0.37"
portable-pty = "0.9.0"
regex = "1"
rfd = "0.18"
# Moteur cryptographique `ring` : compile avec MSVC seul (aws-lc demande NASM et CMake).
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "io-util", "fs", "macros", "net"] }
vt100 = "0.18"

# La cryptographie SSH est très lente sans optimisation : on optimise les
# dépendances même en mode debug, notre propre code reste rapide à compiler.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
# Exécutable plus petit et un peu plus rapide, au prix d'une compilation plus longue.
codegen-units = 1
strip = true

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security_Credentials",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1.34"

# Coffre de mots de passe hors Windows : Secret Service (GNOME Keyring, KWallet…)
# sous Linux, trousseau sous macOS. Windows garde son implémentation (`vault.rs`).
[target.'cfg(not(windows))'.dependencies]
keyring = "4.2"
