[package]
name = "ferroterm"
version = "0.1.0"
edition = "2024"
description = "Client SSH et FTP à onglets avec gestionnaire de sessions et explorateur de fichiers"

# Paquet Debian/Ubuntu : `cargo deb` (voir `cargo install cargo-deb`).
[package.metadata.deb]
maintainer = "Abakou <abakoubusiness@gmail.com>"
section = "net"
priority = "optional"
# Dépendances calculées depuis les bibliothèques liées à l'exécutable.
depends = "$auto"
extended-description = """\
Client SSH à onglets avec gestionnaire de sessions, explorateur SFTP, \
supervision du serveur et shells locaux."""
assets = [
    ["target/release/ferroterm", "usr/bin/", "755"],
    ["assets/ferroterm.desktop", "usr/share/applications/", "644"],
    ["assets/ferroterm-256.png", "usr/share/icons/hicolor/256x256/apps/ferroterm.png", "644"],
]

[dependencies]
anyhow = "1"
arboard = "3"
# Encodage des secrets chiffrés de l'export (déjà utilisé par russh).
base64ct = { version = "1.8", features = ["alloc"] }
diffy = "0.5.2"
directories = "6"
eframe = "0.37"
portable-pty = "0.9.0"
regex = "1"
rfd = "0.18"
# Moteur cryptographique `ring` : compile avec MSVC seul (aws-lc demande NASM et CMake).
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3"
# FTP/FTPS. Même contrainte que russh : TLS avec `ring`, jamais aws-lc.
suppaftp = { version = "13", default-features = false, features = ["tokio", "tokio-rustls-ring", "deprecated"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# Autorités de certification : celles du système (CA d'entreprise) et celles de Mozilla.
rustls-native-certs = "0.8"
webpki-roots = "1"
# Empreinte SHA-256 des certificats FTPS (déjà utilisé par russh).
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "io-util", "fs", "macros", "net"] }
vt100 = "0.18"

# La cryptographie SSH est très lente sans optimisation : on optimise les
# dépendances même en mode debug, notre propre code reste rapide à compiler.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
# Exécutable plus petit et un peu plus rapide, au prix d'une compilation plus longue.
codegen-units = 1
strip = true

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security_Credentials",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1.34"

# Coffre de mots de passe hors Windows : Secret Service (GNOME Keyring, KWallet…)
# sous Linux, trousseau sous macOS. Windows garde son implémentation (`vault.rs`).
[target.'cfg(not(windows))'.dependencies]
keyring = "4.2"
